<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="忠鍵工業點餐app">
<title>忠鍵工業點餐app</title>
<style>
:root{--g1:#f7d878;--g2:#e9b23f;--gtx:#7a5200;--p1:#ff8a3d;--p2:#ff5f2e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#f5f6f8;color:#1c1f23;font-size:15px}
#app{max-width:640px;margin:0 auto;min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
img{display:block}
button{font-family:inherit}
input,select,textarea{font-family:inherit}

/* ---------- 顶部 ---------- */
.topbar{position:sticky;top:0;z-index:20;background:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 0 rgba(31,35,41,.08)}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--gtx);font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 2px 6px var(--g2)}
.brandwrap{flex:1;min-width:0;text-align:center}
.brand{font-size:18px;font-weight:800;letter-spacing:.5px;white-space:nowrap;line-height:1.2;text-align:center}
.brand-sub{font-size:11px;color:#98a0a8;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.iconbtn{border:none;background:#ebedf0;border-radius:50%;width:36px;height:36px;font-size:16px;flex:none;cursor:pointer}

/* ---------- 分类 chips ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 14px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:#fff;border:1px solid #e3e5e8;border-radius:16px;padding:6px 15px;font-size:13px;color:#55595f;cursor:pointer}
.chip.on{background:linear-gradient(135deg,var(--g1),var(--g2));border-color:var(--g2);color:var(--gtx);font-weight:700}

/* ---------- 区块标题 ---------- */
.section-title{font-size:22px;font-weight:800;margin:14px 14px 12px;color:#1c1f23}

/* ---------- 店铺卡片（参考设计稿） ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 14px}
.card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(31,35,41,.06);cursor:pointer}
.thumb{position:relative;aspect-ratio:16/10;background:#e8eaed;display:flex;align-items:center;justify-content:center;font-size:46px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.video-wrap{aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}
.video-wrap iframe{width:100%;height:100%;border:0;display:block}
.frow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0f1f2}
.frow:last-child{border-bottom:0}
.ficon{font-size:24px;flex:none}
.file-preview{max-height:60vh;overflow:auto}
.sheet-wrap table{width:100%;border-collapse:collapse;font-size:12px}
.sheet-wrap td,.sheet-wrap th{border:1px solid #e3e5e8;padding:4px 6px;text-align:left}
.doc-wrap{font-size:14px;line-height:1.7}
.doc-wrap img{max-width:100%}
.badge{position:absolute;top:0;left:0;background:linear-gradient(135deg,var(--g1) 0%,var(--g2) 100%);color:var(--gtx);font-size:12px;font-weight:700;padding:4px 11px;border-radius:10px 0 8px 0;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.card h3{margin:10px 12px 8px;font-size:17px;font-weight:700;color:#1c1f23;line-height:1.3}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:0 12px 12px}
.tag{background:#ececef;color:#64686e;font-size:12px;padding:4px 10px;border-radius:4px}

/* ---------- 按钮 ---------- */
.btn{border:none;border-radius:8px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;box-shadow:0 3px 8px rgba(255,95,46,.3)}
.btn-gold{background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--gtx)}
.btn-ghost{background:#fff;border:1px solid #dcdfe3;color:#55595f}
.btn-danger{background:#fff;border:1px solid #f0c9c9;color:#d64545}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:6px}
.btn-block{width:100%}

/* ---------- 店铺详情 / 菜品 ---------- */
.shop-hero{position:relative;aspect-ratio:21/9;background:#e8eaed;display:flex;align-items:center;justify-content:center;font-size:70px;overflow:hidden}
.shop-hero img{width:100%;height:100%;object-fit:cover}
.shop-info{background:#fff;padding:14px;margin:-18px 14px 12px;border-radius:10px;position:relative;box-shadow:0 2px 8px rgba(31,35,41,.08)}
.shop-info h2{margin:0 0 8px;font-size:20px;font-weight:800}
.dish{display:flex;gap:12px;padding:12px;background:#fff;border-radius:10px;margin:0 14px 10px;box-shadow:0 1px 4px rgba(31,35,41,.05)}
.dish .thumb{width:86px;height:86px;flex:none;border-radius:8px;font-size:36px;aspect-ratio:auto}
.dish-body{flex:1;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.dish-name{font-size:15px;font-weight:700}
.dish-desc{font-size:12px;color:#98a0a8;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dish-foot{display:flex;align-items:center;justify-content:space-between}
.price{color:var(--p2);font-weight:800;font-size:16px}
.price small{font-size:11px;font-weight:600}
.step{display:flex;align-items:center;gap:10px}
.step button{width:26px;height:26px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;font-size:17px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.step button.minus{background:#fff;border:1px solid #dcdfe3;color:#666}
.step span{min-width:14px;text-align:center;font-weight:700}
.backbar{position:sticky;top:0;z-index:20;background:#f5f6f8;padding:12px 14px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}

/* ---------- 购物车条 ---------- */
.cartbar{position:fixed;bottom:calc(58px + env(safe-area-inset-bottom));left:0;right:0;max-width:640px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:12px;background:#fff;border-top:1px solid #ececef;z-index:25}
.cartbar .info{flex:1;font-size:14px}
.cartbar .info b{color:var(--p2)}

/* ---------- 表单 ---------- */
.panel{background:#fff;border-radius:10px;padding:16px 14px;margin:0 14px 12px;box-shadow:0 1px 4px rgba(31,35,41,.05)}
.field{margin-bottom:12px}
.field label{font-size:13px;color:#666a70;display:block;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;border:1px solid #dcdfe3;border-radius:8px;padding:10px 12px;font-size:14px;outline:none;background:#fff;color:#1c1f23}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--g2)}
.row2{display:flex;gap:10px}
.row2 .field{flex:1}

/* ---------- 订单 ---------- */
.order{background:#fff;border-radius:10px;padding:14px;margin:0 14px 12px;box-shadow:0 1px 4px rgba(31,35,41,.05)}
.order-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.order-code{font-size:13px;color:#98a0a8}
.status{font-size:12px;font-weight:700;padding:3px 10px;border-radius:12px}
.status.pending{background:#fff4e5;color:#c77700}
.status.cooking{background:#e8f4ff;color:#1677c9}
.status.done{background:#e8f8ee;color:#1d9e57}
.status.cancelled{background:#fdecec;color:#d64545}
.order-items{font-size:13px;color:#55595f;line-height:1.7;border-top:1px dashed #e3e5e8;padding-top:8px}
.order-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px;color:#98a0a8}

/* ---------- 底部导航 ---------- */
.tabbar{position:fixed;bottom:0;left:0;right:0;max-width:640px;margin:0 auto;background:#fff;display:flex;border-top:1px solid #ececef;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;text-align:center;padding:7px 0 8px;font-size:11px;color:#98a0a8;cursor:pointer;position:relative;border:none;background:none}
.tab .ico{font-size:21px;display:block;line-height:1.25}
.tab.on{color:var(--p2);font-weight:700}
.tab .dot{position:absolute;top:4px;left:50%;margin-left:6px;background:var(--p2);color:#fff;font-size:10px;font-weight:700;border-radius:9px;padding:0 5px;line-height:16px}
.bar-search{flex:1;background:#ebedf0;border:none;border-radius:18px;padding:10px 16px;font-size:14px;outline:none;color:#1c1f23;margin:8px 0 8px 12px}
.bar-search::placeholder{color:#9aa0a6}
.bar-cancel{border:none;background:none;color:#666a70;font-size:13px;padding:0 14px;cursor:pointer;flex:none}

/* ---------- 管理后台 ---------- */
.admin-head{background:#1c1f23;color:#fff;padding:16px 14px;display:flex;align-items:center;justify-content:space-between}
.admin-head h1{margin:0;font-size:17px;font-weight:800}
.admin-head .sub{font-size:11px;color:#9aa0a6;margin-top:2px}
.admin-tabs{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px;background:#1c1f23}
.admin-tabs .chip{background:#2a2e35;border-color:#3a3f47;color:#c9cdd3}
.admin-tabs .chip.on{background:linear-gradient(135deg,var(--g1),var(--g2));border-color:var(--g2);color:var(--gtx)}
.admin-body{padding:14px 14px 30px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;font-size:13px;box-shadow:0 1px 4px rgba(31,35,41,.05)}
th,td{padding:9px 8px;border-bottom:1px solid #f0f1f3;text-align:left;vertical-align:middle}
th{background:#fafbfc;color:#666a70;font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:none}
td .thumb{width:40px;height:40px;border-radius:6px;font-size:18px;aspect-ratio:auto}
.tbl-wrap{overflow-x:auto;margin-bottom:14px}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#1c1f23,#2a2e35)}
.login-card{background:#fff;border-radius:14px;padding:28px 22px;width:100%;max-width:340px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.login-card h1{margin:0 0 4px;font-size:20px;font-weight:800;text-align:center}
.login-card p{margin:0 0 20px;font-size:12px;color:#98a0a8;text-align:center}
.sqlbox{width:100%;min-height:220px;font-family:ui-monospace,Consolas,monospace;font-size:12px;line-height:1.6;border:1px solid #dcdfe3;border-radius:8px;padding:10px;background:#fafbfc;color:#333}
.hint{font-size:12px;color:#98a0a8;line-height:1.7;margin:8px 0}
.kv{font-size:13px;color:#55595f;line-height:1.9}

/* ---------- 其他 ---------- */
.offbar{position:fixed;top:0;left:0;right:0;background:#fff3cd;color:#8a6d1a;text-align:center;font-size:12px;padding:5px;z-index:60;display:none}
body.offline .offbar{display:block}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(28,31,35,.92);color:#fff;font-size:13px;padding:9px 18px;border-radius:20px;z-index:99;opacity:0;pointer-events:none;transition:opacity .25s;max-width:80%;text-align:center}
#toast.show{opacity:1}
.empty{text-align:center;color:#b0b6bd;padding:50px 0;font-size:14px}
.empty .big{font-size:44px;display:block;margin-bottom:10px}
.installbtn{display:none}
</style>
</head>

async function saveSettings(row){

    var r = await sb().from('settings').upsert(row);

/* ---------------- Supabase 数据层（离线自动降级本地） ---------------- */
var _sb = null;
function sb(){
  if (!CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_ANON_KEY) return null;
  if (window.__sbLoadFail || typeof window.supabase === 'undefined') return null;
  if (!_sb) { try { _sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY); } catch(e){ return null; } }
  return _sb;
}
function cloudOk(){ return !!sb() && navigator.onLine; }
function upsertCache(t, row){
  var i = -1;
  for (var k = 0; k < cache[t].length; k++) if (cache[t][k].id === row.id) { i = k; break; }
  if (i >= 0) cache[t][i] = Object.assign({}, cache[t][i], row); else cache[t].push(row);
}
async function refreshAll(){
  if (!cloudOk()) return;
  var changed = false;
  for (var i = 0; i < TBL.length; i++) {
    var t = TBL[i];
    var res = await sb().from(t).select('*');
    if (res && !res.error && Array.isArray(res.data)) { cache[t] = res.data; changed = true; }
  }
  var rs = await sb().from('settings').select('*').eq('id', 'app');
  if (rs && !rs.error && rs.data && rs.data[0]) { cache.settings = Object.assign({}, DEFAULT_SETTINGS, rs.data[0]); changed = true; }
  if (changed) { persist(); applyTheme(); render(); }
}
async function dbAdd(t, row){
  row.id = row.id || uid();
  row.created_at = row.created_at || new Date().toISOString();
  if (cloudOk()) {
    var res = await sb().from(t).insert(row).select();
    if (res && !res.error && res.data && res.data[0]) row = res.data[0];
    else if (res && res.error) toast('云端写入失败：' + res.error.message);
  }
  upsertCache(t, row); persist();
  return row;
}
async function dbUpd(t, row){
  if (cloudOk()) {
    var res = await sb().from(t).update(row).eq('id', row.id);
    if (res && res.error) toast('云端更新失败：' + res.error.message);
  }
  upsertCache(t, row); persist();
}
async function dbDel(t, id){
  if (cloudOk()) {
    var res = await sb().from(t).delete().eq('id', id);
    if (res && res.error) toast('云端删除失败：' + res.error.message);
  }
  cache[t] = cache[t].filter(function(r){ return r.id !== id; });
  persist(); render();
}

/* ---------------- 文件上传 / 下载 ---------------- */
function readDataURL(file){
  return new Promise(function(resolve, reject){
    if (file.size > 4 * 1024 * 1024) { reject(new Error('本地模式文件需小于 4MB')); return; }
    var r = new FileReader();
    r.onload = function(){ resolve(r.result); };
    r.onerror = function(){ reject(new Error('读取失败')); };
    r.readAsDataURL(file);
  });
}
async function uploadFile(file){
  var kind = 'doc';
  if (file.type && file.type.indexOf('image/') === 0) kind = 'image';
  else if (/\.(xlsx|xls|csv)$/i.test(file.name)) kind = 'excel';
  else if (/\.(docx|doc)$/i.test(file.name)) kind = 'word';
  if (cloudOk()) {
    var bucket = kind === 'image' ? 'images' : 'docs';
    var path = Date.now() + '_' + file.name;
    var up = await sb().storage.from(bucket).upload(path, file, { contentType: file.type || 'application/octet-stream' });
    if (!up.error) {
      var pub = sb().storage.from(bucket).getPublicUrl(path);
      return { url: pub.data.publicUrl, kind: kind };
    }
    toast('Supabase 上传失败（' + up.error.message + '），改用本地存储');
  }
  var url = await readDataURL(file);
  return { url: url, kind: kind };
}

function findFile(id){
  for (var i = 0; i < cache.files.length; i++) if (cache.files[i].id === id) return cache.files[i];
  return null;
}
function viewFile(id){
  var f = findFile(id);
  if (!f) return '<div class="empty"><span class="big">😕</span>文件不存在</div>';
  var head = '<div class="backbar"><button class="iconbtn" data-act="go" data-hash="#/">‹</button>' + esc(f.name) + '</div>';
  if (f.kind === 'video') {
    var em = ytEmbed(f.url);
    return head + '<div class="panel"><div class="video-wrap">' + (em ? '<iframe src="' + esc(em) + '" title="' + esc(f.name) + '" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>' : '<div class="empty"><span class="big">⚠️</span>YouTube 连结无效</div>') + '</div></div>';
  }
  setTimeout(function(){ loadPreview(f); }, 0);
  return head + '<div class="panel"><div id="filePreview" class="file-preview"><div class="empty"><span class="big">⏳</span>预览载入中…</div></div>' +
    '<div style="margin-top:10px"><a class="btn btn-primary btn-block" href="' + esc(f.url) + '" download="' + esc(f.name) + '">下载原档</a></div></div>';
}
var _scriptCache = {};
function loadScript(src){
  if (_scriptCache[src]) return _scriptCache[src];
  _scriptCache[src] = new Promise(function(resolve, reject){
    var s = document.createElement('script');
    s.src = src; s.onload = resolve; s.onerror = function(){ reject(new Error('预览元件载入失败（需联网）')); };
    document.head.appendChild(s);
  });
  return _scriptCache[src];
}
function loadPreview(f){
  var box = document.getElementById('filePreview');
  if (!box) return;
  var fail = function(err){ box.innerHTML = '<div class="empty"><span class="big">⚠️</span>预览失败：' + esc(err.message) + '<br>请改用下方「下载原档」</div>'; };
  fetch(f.url).then(function(r){
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.arrayBuffer();
  }).then(function(buf){
    if (f.kind === 'excel') return previewExcel(buf, box);
    if (f.kind === 'word') return previewWord(buf, box);
    throw new Error('此类型仅支持下载');
  }).catch(fail);
}
function previewExcel(buf, box){
  return loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js').then(function(){
    var wb = window.XLSX.read(new Uint8Array(buf), { type: 'array' });
    box.innerHTML = '<div class="sheet-wrap">' + wb.SheetNames.map(function(n){
      var rows = window.XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: '' });
      var tbl = '<table>' + rows.map(function(r){
        return '<tr>' + r.map(function(c){ return '<td>' + esc(String(c)) + '</td>'; }).join('') + '</tr>';
      }).join('') + '</table>';
      return '<div class="kv" style="margin:8px 0 4px"><b>' + esc(n) + '</b></div>' + tbl;
    }).join('') + '</div>';
  });
}
function previewWord(buf, box){
  return loadScript('https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js').then(function(){
    return window.mammoth.convertToHtml({ arrayBuffer: buf });
  }).then(function(res){
    box.innerHTML = '<div class="doc-wrap">' + res.value + '</div>';
  });
}

function fileIcon(kind){

}
function fileKindLabel(kind){

}
function ytEmbed(url){
  var m = String(url || '').trim().match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/);
  return m ? 'https://www.youtube-nocookie.com/embed/' + m[1] : null;
}

/* ---------------- 路由 & 渲染 ---------------- */
function route(){
  var h = location.hash || '#/';
  var parts = h.replace(/^#\//, '').split('/').filter(Boolean);
  return parts;
}
function render(){
  var p = route();
  document.title = settings().app_name;
  var app = $('#app');
  var html = '';
  var showTab = true;
  if (p[0] === 'admin') { showTab = false; html = isAdmin() ? viewAdmin() : viewLogin(); }
  else if (p[0] === 'shop' && p[1]) html = viewShop(p[1]);
  else if (p[0] === 'file' && p[1]) { showTab = false; html = viewFile(p[1]); }
  else if (p[0] === 'cart') html = viewCart();
  else if (p[0] === 'orders') html = viewOrders();
  else html = viewHome();
  app.innerHTML = html + (showTab ? tabbarHTML(p[0] || 'home') : '');
  if (state.searchOpen) {
    var bs = $('#barSearch');
    if (bs) { bs.focus(); try { bs.setSelectionRange(bs.value.length, bs.value.length); } catch(err){} }
  }
  document.body.classList.toggle('offline', !navigator.onLine);
  var ib = $('#installBtn'); if (ib && deferredPrompt) ib.style.display = 'flex';
  window.scrollTo(0, 0);
}
function tabbarHTML(cur){
  var n = cartCount();
  if (state.searchOpen) {
    return '<div class="tabbar"><input class="bar-search" id="barSearch" placeholder="搜索店铺 / 标签" value="' + esc(state.q) + '">' +
      '<button class="bar-cancel" data-act="close-search">取消</button></div>';
  }
  var tabs = [['home', '#/', '🏠', '首页'], ['search', '', '🔍', '搜索'], ['cart', '#/cart', '🛒', '购物车'], ['orders', '#/orders', '🧾', '订单']];
  return '<div class="tabbar">' + tabs.map(function(t){
    if (t[0] === 'search') return '<button class="tab" data-act="toggle-search"><span class="ico">🔍</span>搜索</button>';
    return '<button class="tab' + (cur === t[0] ? ' on' : '') + '" data-act="go" data-hash="' + t[1] + '"><span class="ico">' + t[2] + '</span>' + t[3] +
      (t[0] === 'cart' && n ? '<span class="dot">' + n + '</span>' : '') + '</button>';
  }).join('') + '</div>';
}

/* ---------------- 交互：点击委托 ---------------- */
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var act = el.dataset.act, id = el.dataset.id;
  if (act === 'go') { location.hash = el.dataset.hash; }
  else if (act === 'logo-tap') {
    var now = Date.now();
    if (now - logoTaps.t > 1500) logoTaps.n = 0;
    logoTaps.t = now; logoTaps.n++;
    if (logoTaps.n >= 5) { logoTaps.n = 0; location.hash = '#/admin'; }
  }
  else if (act === 'chip') { state.chip = id; render(); }
  else if (act === 'toggle-search') { state.searchOpen = true; render(); }
  else if (act === 'close-search') { state.searchOpen = false; state.q = ''; render(); }
  else if (act === 'open-shop') { location.hash = '#/shop/' + id; }
  else if (act === 'add') { cartAdd(id); }
  else if (act === 'sub') { cartSub(id); }
  else if (act === 'clear-cart') { cart = { shop_id: null, items: {} }; saveCart(); render(); }
  else if (act === 'install') { doInstall(); }
  else if (act === 'admin-tab') { state.adminTab = id; state.editShop = null; state.editDish = null; state.editOrder = null; state.editFile = null; render(); }
  else if (act === 'new-shop') { state.editShop = 'new'; render(); }
  else if (act === 'edit-shop') { state.editShop = id; render(); }
  else if (act === 'cancel-shop') { state.editShop = null; render(); }
  else if (act === 'del-shop') { if (confirm('删除该店铺？其菜品将同时不可见。')) dbDel('shops', id); }
  else if (act === 'new-dish') { state.editDish = 'new'; render(); }
  else if (act === 'edit-dish') { state.editDish = id; render(); }
  else if (act === 'cancel-dish') { state.editDish = null; render(); }
  else if (act === 'del-dish') { if (confirm('删除该菜品？')) dbDel('dishes', id); }
  else if (act === 'del-order') { if (confirm('删除该订单？')) dbDel('orders', id); }
  else if (act === 'edit-order') { state.editOrder = id; render(); }
  else if (act === 'cancel-order') { state.editOrder = null; render(); }
  else if (act === 'del-file') { if (confirm('删除该文件记录？')) dbDel('files', id); }
  else if (act === 'open-file') { location.hash = '#/file/' + id; }
  else if (act === 'add-yt') {
    var inp = document.getElementById('ytUrl');
    var raw = inp ? inp.value.trim() : '';
    if (!ytEmbed(raw)) { toast('YouTube 连结格式不对'); return; }
    dbAdd('files', { name: 'YouTube 影片', kind: 'video', url: raw }).then(function(){ toast('影片已新增'); render(); });
  }
  else if (act === 'edit-file') { state.editFile = id; render(); }
  else if (act === 'cancel-file') { state.editFile = null; render(); }
  else if (act === 'logout') { sessionStorage.removeItem('jpd_admin'); location.hash = '#/'; render(); }
  else if (act === 'copy-sql') { copyText(SQL_SCHEMA, 'SQL 已复制'); }
  else if (act === 'copy-sw') { copyText(SW_SRC, 'sw.js 代码已复制'); }
  else if (act === 'backup-export') { exportBackup(); }
  else if (act === 'backup-import') { var bf = document.getElementById('backupFile'); if (bf) bf.click(); }
});
function exportBackup(){
  var blob = new Blob([JSON.stringify(cache, null, 2)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'zhongjian-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); if (a.parentNode) a.parentNode.removeChild(a); }, 0);
  toast('备份已下载');
}
function importBackup(input){
  var file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  var r = new FileReader();
  r.onload = function(){
    var data;
    try { data = JSON.parse(r.result); } catch(e){ toast('备份档读取失败'); return; }
    if (!data || !Array.isArray(data.shops) || !Array.isArray(data.dishes)) { toast('备份档格式不对'); return; }
    if (!confirm('还原将覆盖当前全部资料（店铺／菜品／订单／设置），继续？')) return;
    cache.shops = data.shops;
    cache.dishes = data.dishes;
    cache.orders = Array.isArray(data.orders) ? data.orders : [];
    cache.files = Array.isArray(data.files) ? data.files : [];
    cache.settings = Object.assign({}, DEFAULT_SETTINGS, data.settings || {});
    persist(); applyTheme(); render();
    toast('还原完成');
  };
  r.readAsText(file);
}
function copyText(t, msg){
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function(){ toast(msg); }, function(){ fallbackCopy(t, msg); });
  else fallbackCopy(t, msg);
}
function fallbackCopy(t, msg){
  var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast(msg); } catch(e){ toast('复制失败，请手动选择'); }
  document.body.removeChild(ta);
}

/* ---------------- 交互：输入 & 变更委托 ---------------- */
document.addEventListener('input', function(e){
  if (e.target.id === 'barSearch') {
    state.q = e.target.value.trim();
    if (route()[0]) { location.hash = '#/'; }
    else { var g2 = $('#shopGrid'); if (g2) g2.innerHTML = shopGridHTML(); }
  }
});
document.addEventListener('change', function(e){
  var t = e.target;
  if (t.id === 'backupFile') { importBackup(t); return; }
  if (t.matches('select[data-filter-shop]')) { state.dishShopFilter = t.value; render(); return; }
  if (t.matches('select[data-status]')) { dbUpd('orders', { id: t.dataset.id, status: t.value }).then(render); return; }
  if (t.matches('input[type=file]')) { handleFilePick(t); return; }
});
function handleFilePick(input){
  var file = input.files && input.files[0];
  if (!file) return;
  var target = input.dataset.target;
  toast('上传中…');
  uploadFile(file).then(function(res){
    if (target) {
      var hid = document.getElementById(target);
      if (hid) hid.value = res.url;
      toast('上传成功，记得点保存');
      var prev = document.createElement('img');
      prev.src = res.url; prev.style.cssText = 'width:70px;height:46px;object-fit:cover;border-radius:6px;margin-top:6px';
      input.parentNode.appendChild(prev);
    } else {
      dbAdd('files', { name: file.name, kind: res.kind, url: res.url, size: file.size }).then(function(){ toast('上传成功'); render(); });
    }
  }).catch(function(err){ toast('上传失败：' + err.message); });
  input.value = '';
}

/* ---------------- 交互：购物车 ---------------- */
function cartAdd(dishId){
  var d = findDish(dishId); if (!d) return;
  if (cart.shop_id && cart.shop_id !== d.shop_id && cartCount() > 0) {
    if (!confirm('购物车中有其他店铺的菜品，替换为当前店铺？')) return;
    cart = { shop_id: d.shop_id, items: {} };
  }
  cart.shop_id = d.shop_id;
  cart.items[dishId] = (cart.items[dishId] || 0) + 1;
  saveCart(); render();
}
function cartSub(dishId){
  if (!cart.items[dishId]) return;
  cart.items[dishId]--;
  if (cart.items[dishId] <= 0) delete cart.items[dishId];
  if (!cartCount()) cart.shop_id = null;
  saveCart(); render();
}

/* ---------------- 交互：表单提交 ---------------- */
document.addEventListener('submit', function(e){
  var f = e.target;
  var kind = f.dataset.form;
  if (!kind) return;
  e.preventDefault();
  var fd = new FormData(f);
  if (kind === 'login') {
    if (fd.get('user') === settings().admin_user && fd.get('pass') === settings().admin_pass) {
      sessionStorage.setItem('jpd_admin', '1'); toast('登录成功'); render();
    } else toast('账号或密码错误');
  }
  else if (kind === 'shop') {
    var row = {
      name: String(fd.get('name') || '').trim(),
      tags: String(fd.get('tags') || '').split(/[,，]/).map(function(s){ return s.trim(); }).filter(Boolean),
      badge: String(fd.get('badge') || '').trim(),
      emoji: String(fd.get('emoji') || '').trim(),
      image: String(fd.get('image') || ''),
      descr: String(fd.get('descr') || '').trim()
    };
    if (state.editShop === 'new') dbAdd('shops', row).then(function(){ state.editShop = null; toast('已新增店铺'); render(); });
    else { row.id = state.editShop; dbUpd('shops', row).then(function(){ state.editShop = null; toast('已保存'); render(); }); }
  }
  else if (kind === 'dish') {
    var drow = {
      shop_id: String(fd.get('shop_id')),
      name: String(fd.get('name') || '').trim(),
      price: Number(fd.get('price') || 0),
      emoji: String(fd.get('emoji') || '').trim(),
      image: String(fd.get('image') || ''),
      descr: String(fd.get('descr') || '').trim()
    };
    if (state.editDish === 'new') dbAdd('dishes', drow).then(function(){ state.editDish = null; toast('已新增菜品'); render(); });
    else { drow.id = state.editDish; dbUpd('dishes', drow).then(function(){ state.editDish = null; toast('已保存'); render(); }); }
  }
  else if (kind === 'order') {
    var ids = Object.keys(cart.items).filter(function(k){ return cart.items[k] > 0; });
    if (!ids.length) { toast('购物车为空'); return; }
    var items = ids.map(function(id){ var d = findDish(id); return { dish_id: id, name: d.name, price: Number(d.price), qty: cart.items[id] }; });
    var cust = { name: String(fd.get('name') || '').trim(), phone: String(fd.get('phone') || '').trim(), table: String(fd.get('table') || '').trim(), remark: String(fd.get('remark') || '').trim(), device: deviceId() };
    LS.set('jpd_customer', { name: cust.name, phone: cust.phone, table: cust.table });
    var order = { code: 'NO' + Date.now().toString().slice(-8), shop_id: cart.shop_id, items: items, total: cartTotal(), customer: cust, status: 'pending' };
    cart = { shop_id: null, items: {} }; saveCart();
    dbAdd('orders', order).then(function(){ toast('下单成功 🎉'); location.hash = '#/orders'; render(); });
  }
  else if (kind === 'settings') {
    saveSettings({
      app_name: String(fd.get('app_name') || '').trim(),
      logo_char: String(fd.get('logo_char') || '').trim(),
      app_sub: String(fd.get('app_sub') || '').trim(),
      section_title: String(fd.get('section_title') || '').trim(),
      admin_user: String(fd.get('admin_user') || '').trim(),
      admin_pass: String(fd.get('admin_pass') || ''),
      gold1: String(fd.get('gold1') || ''), gold2: String(fd.get('gold2') || ''), gold_tx: String(fd.get('gold_tx') || ''),
      primary1: String(fd.get('primary1') || ''), primary2: String(fd.get('primary2') || ''),
      st_pending: String(fd.get('st_pending') || ''), st_cooking: String(fd.get('st_cooking') || ''),
      st_done: String(fd.get('st_done') || ''), st_cancelled: String(fd.get('st_cancelled') || '')
    });
  }
  else if (kind === 'order-edit') {
    var oid = state.editOrder, o = null;
    for (var oi = 0; oi < cache.orders.length; oi++) if (cache.orders[oi].id === oid) o = cache.orders[oi];
    if (o) {
      dbUpd('orders', {
        id: oid, status: String(fd.get('status')), total: Number(fd.get('total') || 0),
        customer: Object.assign({}, o.customer, {
          name: String(fd.get('name') || '').trim(), phone: String(fd.get('phone') || '').trim(),
          table: String(fd.get('table') || '').trim(), remark: String(fd.get('remark') || '').trim()
        })
      }).then(function(){ state.editOrder = null; toast('已保存'); render(); });
    }
  }
  else if (kind === 'file-edit') {
    dbUpd('files', { id: state.editFile, name: String(fd.get('name') || '').trim() }).then(function(){ state.editFile = null; toast('已保存'); render(); });
  }
});

/* ---------------- PWA：manifest / 图标 / 安装 / SW / 离线 ---------------- */
var deferredPrompt = null;
window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferredPrompt = e; var b = $('#installBtn'); if (b) b.style.display = 'flex'; });
function doInstall(){ if (!deferredPrompt) { toast('浏览器菜单中可选择「添加到主屏幕」'); return; } deferredPrompt.prompt(); deferredPrompt = null; var b = $('#installBtn'); if (b) b.style.display = 'none'; }
function pngIcon(size){
  var c = document.createElement('canvas'); c.width = c.height = size;
  var x = c.getContext('2d');
  var s = settings();
  var g = x.createLinearGradient(0, 0, size, size);
  g.addColorStop(0, s.gold1); g.addColorStop(1, s.gold2);
  x.fillStyle = g; x.fillRect(0, 0, size, size);
  x.fillStyle = 'rgba(255,255,255,.25)'; x.beginPath(); x.arc(size * 0.82, size * 0.16, size * 0.3, 0, Math.PI * 2); x.fill();
  x.fillStyle = s.gold_tx; x.font = 'bold ' + Math.round(size * 0.5) + 'px sans-serif';
  x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(s.logo_char || '餐', size / 2, size * 0.55);
  return c.toDataURL('image/png');
}
var manifestLink = null, appleLink = null;
function setupPWA(){
  var s = settings();
  var manifest = {
    name: s.app_name, short_name: s.app_name,
    start_url: location.pathname, scope: location.pathname.replace(/[^/]*$/, ''),
    display: 'standalone', background_color: '#f5f6f8', theme_color: '#f5f6f8',
    icons: [
      { src: pngIcon(192), sizes: '192x192', type: 'image/png', purpose: 'any' },
      { src: pngIcon(512), sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
    ]
  };
  if (!manifestLink) { manifestLink = document.createElement('link'); manifestLink.rel = 'manifest'; document.head.appendChild(manifestLink); }
  manifestLink.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
  if (!appleLink) { appleLink = document.createElement('link'); appleLink.rel = 'apple-touch-icon'; document.head.appendChild(appleLink); }
  appleLink.href = pngIcon(180);
  if ('serviceWorker' in navigator && location.protocol !== 'file:' && !window.__swTried) {
    window.__swTried = 1;
    navigator.serviceWorker.register('sw.js').catch(function(){ /* 单文件部署时忽略：离线依赖浏览器缓存与本地数据 */ });
  }
}
window.addEventListener('online', function(){ document.body.classList.remove('offline'); toast('已恢复联网'); refreshAll(); });
window.addEventListener('offline', function(){ document.body.classList.add('offline'); toast('网络已断开，进入离线模式'); render(); });

/* ---------------- 启动 ---------------- */
window.addEventListener('hashchange', render);
applyTheme();
setupPWA();
render();
refreshAll();
</script>
